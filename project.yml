name: GitPico
options:
  minimumXcodeGenVersion: 2.46.0
  projectFormat: xcode16_0
  xcodeVersion: "27.1"
  deploymentTarget:
    macOS: "26.0"
  defaultConfig: Debug
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_APP_SANDBOX: NO
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
fileGroups:
  - Configuration
  - script
  - README.md
  - AGENTS.md
  - Package.swift
  - project.yml
targets:
  GitCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/GitCore
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willsuo.GitPico.GitCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  GitPico:
    type: application
    platform: macOS
    sources:
      - path: Sources/GitPico
        type: syncedFolder
      - path: Resources/AppIcon.icon
    dependencies:
      - target: GitCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willsuo.GitPico
        MARKETING_VERSION: "0.01"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: $(DERIVED_FILE_DIR)/GitPico-Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_HARDENED_RUNTIME: NO
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
    preBuildScripts:
      - name: Generate Date Build Number
        script: /usr/bin/python3 "$SRCROOT/script/xcode_build_metadata.py"
        basedOnDependencyAnalysis: false
        showEnvVars: false
        inputFiles:
          - $(SRCROOT)/Configuration/GitPico-Info.plist
          - $(SRCROOT)/script/xcode_build_metadata.py
          - $(SRCROOT)/script/build_number.py
        outputFiles:
          - $(DERIVED_FILE_DIR)/GitPico-Info.plist
  GitCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/GitCoreTests
        type: syncedFolder
    dependencies:
      - target: GitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willsuo.GitPico.GitCoreTests
        GENERATE_INFOPLIST_FILE: YES
  GitPicoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/GitPicoTests
        type: syncedFolder
    dependencies:
      - target: GitPico
      - target: GitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willsuo.GitPico.GitPicoTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GitPico.app/Contents/MacOS/GitPico
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  GitPico:
    build:
      targets:
        GitPico: all
        GitCoreTests: [test]
        GitPicoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      commandLineArguments:
        --background-testing: true
      environmentVariables:
        GITPICO_NATIVE_XCODE_TESTS: "1"
      targets:
        - name: GitCoreTests
          parallelizable: true
        - name: GitPicoTests
          parallelizable: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
      orderHint: 0
