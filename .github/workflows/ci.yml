name: Build and Test
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Record actual runtime and toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: Ensure Git LFS integration test dependency
        run: |
          if ! git lfs version; then brew install git-lfs; fi
          git lfs version
      - name: Test saved Xcode project without regeneration
        run: |
          mkdir -p .build/ci
          xcodebuild test -project GitPico.xcodeproj -scheme GitPico \
            -derivedDataPath .build/ci-derived \
            -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            -parallel-testing-enabled NO \
            -resultBundlePath .build/ci/Tests.xcresult \
            > .build/ci/xcodebuild.log 2>&1
      - name: Validate packaging scripts and development metadata
        run: |
          python3 -m unittest discover -s script/tests -p 'test_*.py'
          bash -n script/package_release.sh
          bash -n script/publish_github_release.sh
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.runner }}
          path: .build/ci
          retention-days: 14
